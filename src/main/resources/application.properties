# 应用名称，用于日志标识和 Spring 配置。
spring.application.name=ticket-api
# 练习服务只监听本机地址。
server.address=127.0.0.1
# HTTP 端口；重新启动前先停止旧实例，避免端口被占用。
server.port=8080
# 从启动进程的环境变量读取数据库配置，密码不写进仓库。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Mapper 接口的方法对应这里的 XML SQL。
mybatis.mapper-locations=classpath:mapper/*.xml

# 本地练习账号密码，从环境变量读取；数据库账号 ticket_app 与登录账号不同。
app.security.alice-password=${LAB_ALICE_PASSWORD}
app.security.bob-password=${LAB_BOB_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 两个处理人用于验证接单竞争，密码也只从启动环境读取。
app.security.agent1-password=${LAB_AGENT1_PASSWORD}
app.security.agent2-password=${LAB_AGENT2_PASSWORD}
